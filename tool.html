<body>
<header><div class="brand"><span class="logo">VI</span><h1>VISUAL INSPECTION - PACKAGING <span>- DEFECT REVIEW PLATFORM</span></h1></div><span id="credit"></span></header>
<main>
<div class="panel bar">
  <label class="up">Choose Excel File<input type="file" id="file" accept=".xlsx" hidden></label>
  <span id="fname">No file selected</span>
  <span id="msg"></span>
  <button class="ghost" id="clear" style="margin-left:auto">Clear saved reviews</button>
</div>
<div class="intro" id="intro"><div class="ico">&#8593;</div><h2>Review static defects faster</h2><p>Choose the static .xlsx file above, or drop it anywhere on this page.<br>Everything stays on your computer; nothing is uploaded.</p></div>
<div class="panel fl" id="filters" hidden>
  <span id="msbox" style="display:contents"></span>
  <input type="text" id="q" placeholder="Search ASIN, ID or login">
  <select id="psize" aria-label="Defects per page"><option>10</option><option>25</option><option>50</option></select><span style="color:var(--mut)">per page</span>
  <select id="sort" aria-label="Sort">
    <option value="file">Sort: File order</option>
    <option value="assoc">Sort: Associate A-Z</option>
    <option value="asin">Sort: ASIN A-Z</option><option value="date">Sort: Newest review date</option></select>
  <div class="seg" id="status"></div>
  <div id="chips"></div>
</div>
<div id="warn" hidden></div>
<div id="sum" hidden>
  <div class="sh"><b>Disputed (<span id="dc">0</span>)</b><span class="sp"></span>
    <label>Email Received Date <input type="date" id="rd"></label>
    <button id="copy">Copy to Clipboard (Excel Format)</button><span id="ok">Copied!</span><button class="ghost" id="stg">Show list</button></div>
  <div id="slist" hidden></div>
</div>
<div id="rca" hidden>
  <div class="sh"><b>RCA ready (<span id="rn">0</span>)</b><span id="rpend"></span><span class="sp"></span><span id="rok">Copied!</span><button id="rcopy">Copy all RCA</button><button class="ghost" id="rtg">Hide</button></div>
  <div id="rlist"></div>
</div>
<div id="stats"></div>
<div id="prog"><i></i></div>
<div id="list"></div>
<div id="pager"></div>
</main>
<div id="vbar" hidden><button id="vp" aria-label="Previous image">&#8249;</button><span id="vt"></span><button id="vn" aria-label="Next image">&#8250;</button><button id="vx" aria-label="Close">&times;</button></div>
<button id="top" aria-label="Back to top" hidden>&#8593;</button>
<footer id="foot"></footer>

<script>
const $ = id => document.getElementById(id);
const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const safeUrl = u => (/^https?:\/\//i.test(u) ? u : '');
const CREDIT = { name: 'Abhishek Sharma', contact: 'lshaabh', ver: 'v2.0' };
const DL = 'https://share.amazon.com/sites/cpexaudits/Lists/CPEXAudits/EditForm.aspx?ID=';
const KEY = 'defectReview.static.v2';
const MAX_IMG = 4;   // image links allowed per disputed defect
const MS = { mgr: 'Manager', assoc: 'Associate', date: 'Job Review Date', pkg: 'Package Type', week: 'Week' };
const ORDER = Object.keys(MS);
const SL = { all: 'All', un: 'Unreviewed', rev: 'Reviewed', dis: 'Disputed' };
const newF = () => Object.fromEntries(ORDER.map(k => [k, new Set()]));
let rows = [], F = newF(), stat = 'all', state = {}, activeCard = null;
let page = 0;
try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { state = {}; }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
$('credit').textContent = 'Built by ' + CREDIT.name + ' | ' + CREDIT.ver;
$('foot').textContent = 'Defect Review Platform ' + CREDIT.ver + ' | Contact: ' + CREDIT.contact;
{ const t = new Date(); $('rd').value = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate()); }

/* ---------- read .xlsx without any library ---------- */
async function unzip(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), files = {};
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  for (let i = 0; i < n; i++) {
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    files[new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl))] = { m: dv.getUint16(p + 10, true), cs: dv.getUint32(p + 20, true), lo: dv.getUint32(p + 42, true) };
    p += 46 + nl + xl + cl;
  }
  return async name => {
    const f = files[name]; if (!f) return null;
    const s = f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true), d = u8.subarray(s, s + f.cs);
    if (f.m === 0) return new TextDecoder().decode(d);
    return new TextDecoder().decode(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  };
}
async function parseXlsx(buf) {
  const get = await unzip(buf), P = x => new DOMParser().parseFromString(x, 'application/xml');
  const wb = P(await get('xl/workbook.xml')), rels = P(await get('xl/_rels/workbook.xml.rels'));
  const rid = wb.getElementsByTagName('sheet')[0].getAttribute('r:id');
  let target = 'worksheets/sheet1.xml';
  for (const r of rels.getElementsByTagName('Relationship')) if (r.getAttribute('Id') === rid) target = r.getAttribute('Target');
  target = target.replace(/^\//, ''); if (!target.startsWith('xl/')) target = 'xl/' + target;
  const ss = [], sst = await get('xl/sharedStrings.xml');
  if (sst) for (const si of P(sst).getElementsByTagName('si')) {
    let s = ''; for (const x of si.getElementsByTagName('t')) if (x.parentNode.nodeName !== 'rPh') s += x.textContent; ss.push(s);
  }
  const dateXf = [], st = await get('xl/styles.xml');
  if (st) {
    const sd = P(st), custom = {};
    for (const nf of sd.getElementsByTagName('numFmt')) custom[nf.getAttribute('numFmtId')] = nf.getAttribute('formatCode');
    const cx = sd.getElementsByTagName('cellXfs')[0];
    if (cx) for (const xf of cx.getElementsByTagName('xf')) {
      const id = +xf.getAttribute('numFmtId'), code = custom[id];
      dateXf.push(code ? /[dmy]/i.test(code.replace(/"[^"]*"|\[[^\]]*\]/g, '')) : (id >= 14 && id <= 22) || (id >= 45 && id <= 47));
    }
  }
  const data = [];
  for (const r of P(await get(target)).getElementsByTagName('row')) {
    const row = [];
    for (const c of r.getElementsByTagName('c')) {
      let ci = 0; for (const ch of c.getAttribute('r').replace(/\d/g, '')) ci = ci * 26 + ch.charCodeAt(0) - 64;
      const ty = c.getAttribute('t'), v = c.getElementsByTagName('v')[0]; let val = '';
      if (ty === 's') val = ss[+v.textContent]; else if (ty === 'inlineStr') val = c.textContent;
      else if (v) {
        val = v.textContent;
        if ((!ty || ty === 'n') && dateXf[+c.getAttribute('s')]) { const d = new Date(Math.round((+val - 25569) * 864e5)); val = pad(d.getUTCMonth() + 1) + '/' + pad(d.getUTCDate()) + '/' + d.getUTCFullYear(); }
      }
      row[ci - 1] = val;
    }
    data.push(row);
  }
  return data;
}
async function loadFile(f) {
  if (!f) return;
  $('fname').textContent = f.name; $('msg').className = ''; $('msg').textContent = 'Reading file...';
  try { build(await parseXlsx(await f.arrayBuffer())); $('msg').textContent = rows.length + ' defects loaded'; $('intro').hidden = true; }
  catch (err) {
    console.error(err); $('msg').className = 'err';
    $('msg').textContent = err.friendly ? err.message : 'Could not read this file. Please choose the static .xlsx file (use Chrome, Edge or Firefox).';
  }
}

/* ---------- RCA: one report per login and review date, ready when every defect of it is reviewed ---------- */
const VP_ATTRS = ['VARIABLE_PACKAGING'];   // attributes that make a defect a "Variable Packaging" defect
let rcaG = [], rcaShown = [];
// 'vp' = has a variable packaging attribute, 'pm' = package material is the ONLY wrong attribute, else 'other'
function defectKind(r) {
  const names = new Set();
  r.root.split('||').forEach(p => {
    const m = p.match(/^\s*(?:INCORRECT|MISSED) ATTRIBUTE:(.*)$/i);
    if (m) m[1].split(',').forEach(a => { if (a.includes(':')) names.add(a.split(':')[0].trim().toUpperCase()); });
  });
  if (VP_ATTRS.some(a => names.has(a))) return 'vp';
  return names.size === 1 && names.has('PACKAGE_MATERIAL') ? 'pm' : 'other';
}
function rcaGroup() {
  const g = new Map();
  rows.forEach(r => { const k = r.assoc + '|' + r.date; if (!g.has(k)) g.set(k, { key: k, login: r.assoc, date: r.date, rows: [] }); g.get(k).rows.push(r); });
  return [...g.values()];
}
function rcaText(x) {
  const n = k => x.rows.filter(r => r.kind === k).length, dk = k => x.rows.filter(r => isOn(r, 'd') && r.kind === k).length;
  const dis = dk('vp') + dk('pm') + dk('other');
  return ['Login : ' + (x.login || 'N/A').toLowerCase(), 'Date : ' + (x.date || 'N/A'), 'Total Defects Received : ' + x.rows.length,
    'Variable Packaging : ' + n('vp'), 'Package Material : ' + n('pm'),
    'Updated for Dispute Review : ' + dis + ' (' + dk('vp') + ' VP, ' + dk('pm') + ' Package material, ' + dk('other') + ' Other)',
    'Simple Misses : ' + (x.rows.length - dis)].join('\n');
}
function rcaRender() {
  const vis = new Set(rows.filter(r => match(r, null, true)).map(r => r.assoc + '|' + r.date));
  const list = rcaG.filter(x => vis.has(x.key));
  rcaShown = list.filter(x => x.rows.every(r => isOn(r, 'r')));
  $('rca').hidden = !rcaShown.length;
  $('rn').textContent = rcaShown.length;
  $('rpend').textContent = list.length > rcaShown.length ? (list.length - rcaShown.length) + ' more still being reviewed' : '';
  $('rlist').innerHTML = rcaShown.map((x, i) => `<div class="rg"><pre>${E(rcaText(x))}</pre><button class="ghost" data-rc="${i}">Copy</button></div>`).join('');
}
function copyText(t) {
  const done = () => { $('rok').style.display = 'inline'; setTimeout(() => $('rok').style.display = 'none', 2500); };
  const fb = () => { const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(fb); else fb();
}

/* ---------- rows ---------- */
const base = u => u.replace(/\?X-Amz.*$/, '');
const orig = u => base(u).replace('crop_rgb_image', 'raw_rgb_image').replace('/cropped/', '/');
// one link per image: repeated links go, and a cropped copy goes when its original is there
function usefulImages(list) {
  const seen = new Set(), uniq = list.filter(m => { const b = base(m.u); if (seen.has(b)) return false; seen.add(b); return true; });
  return uniq.filter(m => orig(m.u) === base(m.u) || !seen.has(orig(m.u)));
}
const isExp = r => r.exp && Date.parse(r.exp) + 864e5 < Date.now();
function build(data) {
  const hd = (data[0] || []).map(h => String(h || '').trim()), H = {};
  hd.forEach((h, i) => H[h.toLowerCase()] = i);
  if (H.id === undefined && H.asin === undefined) { const e = new Error('The ID and ASIN columns were not found. Please choose the static defect file.'); e.friendly = true; throw e; }
  const ic = hd.map((h, i) => [h, i]).filter(a => /^url[_ ]?\d+$/i.test(a[0])).sort((a, b) => a[0].replace(/\D/g, '') - b[0].replace(/\D/g, '')).map(a => a[1]);
  const g = (r, k) => H[k] !== undefined && r[H[k]] != null ? String(r[H[k]]).trim() : '';
  rows = data.slice(1).filter(r => r && (g(r, 'id') || g(r, 'asin'))).map(r => {
    const all = ic.map((c, k) => ({ k, u: r[c] ? String(r[c]).trim() : '' })).filter(m => safeUrl(m.u)), imgs = usefulImages(all);
    return {
      id: g(r, 'id'), asin: g(r, 'asin'), pkg: g(r, 'package type'), week: g(r, 'week'), assoc: g(r, 'associate 1'),
      date: g(r, 'job review date'), mgr: g(r, 'manager'), resp: g(r, 'decision_reason_code_1'), aud: g(r, 'auditor reason code'),
      root: g(r, 'root cause 1'), exp: g(r, 'url_expiry_date'), recv: g(r, 'email received date'), imgs, hidden: all.length - imgs.length,
      retail: safeUrl(g(r, 'retail page url')) || (g(r, 'asin') ? 'http://www.amazon.com/dp/' + g(r, 'asin') : '')
    };
  });
  const seen = {};
  rows.forEach(r => { const s = state[r.id + '|' + r.assoc]; if (!s) return; if (s.d) s.r = true; if (s.i && s.i.length > MAX_IMG) s.i = s.i.slice().sort((a, b) => a - b).slice(0, MAX_IMG); });   // older saved marks: disputed means reviewed, at most MAX_IMG images
  rows.forEach(r => { const k = r.id + '|' + r.assoc; seen[k] = (seen[k] || 0) + 1; r.key = seen[k] > 1 ? k + '#' + seen[k] : k; });
  rows.forEach(r => r.kind = defectKind(r)); rcaG = rcaGroup();
  F = newF(); stat = 'all'; $('q').value = '';
  page = 0;
  $('msbox').innerHTML = ORDER.map(k => `<details class="ms" data-k="${k}"><summary>${MS[k]}: <i>All</i></summary><div class="pn"><input type="text" class="sq" placeholder="Search ${MS[k].toLowerCase()}..."><div class="pb"><button type="button" class="ghost" data-all="1">Select shown</button><button type="button" class="ghost" data-clr="1">Clear</button></div><div class="ol"></div></div></details>`).join('');
  $('filters').hidden = false;
  const notes = [], x = rows.filter(isExp).length;
  if (x) notes.push(x + ' of ' + rows.length + ' defects have image links past their expiry date.');
  $('warn').hidden = !notes.length; $('warn').innerHTML = notes.map(E).join('<br>');
  if (!rows.length) { $('warn').hidden = false; $('warn').textContent = 'No defects were found.'; }
  render(); sumRender();
}

/* ---------- filters ---------- */
function match(r, skip, noStatus) {
  for (const k of ORDER) if (k !== skip && F[k].size && !F[k].has(r[k])) return false;
  if (!noStatus) { const s = state[r.key] || {}; if ((stat === 'un' && s.r) || (stat === 'rev' && !s.r) || (stat === 'dis' && !s.d)) return false; }
  const q = $('q').value.trim().toLowerCase();
  return !q || (r.id + ' ' + r.asin + ' ' + r.assoc).toLowerCase().includes(q);
}
function flt() {
  const f = rows.filter(r => match(r)), m = $('sort').value;
  if (m === 'asin') f.sort((a, b) => a.asin.localeCompare(b.asin));
  else if (m === 'date') f.sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
  else if (m === 'assoc') f.sort((a, b) => a.assoc.localeCompare(b.assoc));
  return f;
}
function fillMS(k) {
  const d = document.querySelector('.ms[data-k="' + k + '"]'); if (!d) return;
  const cnt = {}; rows.forEach(r => { if (r[k] && match(r, k, true)) cnt[r[k]] = (cnt[r[k]] || 0) + 1; });
  F[k].forEach(v => { if (!(v in cnt)) cnt[v] = 0; });
  const sq = d.querySelector('.sq').value.toLowerCase(), vals = Object.keys(cnt);
  if (k === 'date') vals.sort((a, b) => Date.parse(b) - Date.parse(a)); else if (k === 'week') vals.sort((a, b) => b - a); else vals.sort();
  const box = d.querySelector('.ol'), top = box.scrollTop;
  box.innerHTML = vals.filter(v => v.toLowerCase().includes(sq)).map(v => `<label><input type="checkbox" value="${E(v)}"${F[k].has(v) ? ' checked' : ''}><span>${E(v)}</span><em>${cnt[v]}</em></label>`).join('') || '<p class="none">No options</p>';
  box.scrollTop = top;
  d.querySelector('summary i').textContent = F[k].size ? F[k].size + ' selected' : 'All';
  d.classList.toggle('act', F[k].size > 0);
}

/* ---------- cards ---------- */
const chips = (x, c) => String(x).split(',').map(a => a.trim()).filter(Boolean).map(a => `<span class="chip ${c}">${E(a)}</span>`).join('');
function rootHTML(x) {
  let inc = '', mis = '';
  x.split('||').forEach(p => { const m = p.match(/^\s*(INCORRECT|MISSED) ATTRIBUTE:(.*)$/i); if (m) { if (/^i/i.test(m[1])) inc = m[2]; else mis = m[2]; } });
  return (inc ? `<div>Incorrect: ${chips(inc, 'bad')}</div>` : '') + (mis ? `<div>Missed: ${chips(mis, 'miss')}</div>` : '') || E(x);
}
function metaPills(r) {
  const pill = (l, v) => (v ? l + v : '');
  const p = [pill('ID ', r.id), pill('Login: ', r.assoc), r.date, pill('Week ', r.week), r.pkg, pill('Manager: ', r.mgr)];
  return p.filter(Boolean).map(t => `<span>${E(t)}</span>`).join('');
}
function card(r) {
  const s = state[r.key] || {}, sel = new Set(s.i || []), n = r.imgs.length;
  let tags = isExp(r) ? '<span class="exp">Image links expired</span>' : '';
  const nav = `<div class="inav"><button type="button" class="ghost" data-nav="-1" aria-label="Previous image">&#8249;</button><span class="icur"${r.hidden ? ` title="${r.hidden} repeated or cropped link${r.hidden === 1 ? '' : 's'} hidden"` : ''}>${n} image${n === 1 ? '' : 's'}</span><button type="button" class="ghost" data-nav="1" aria-label="Next image">&#8250;</button></div>`;
  const pills = r.imgs.map((m, i) => { const lock = !sel.has(m.k) && sel.size >= MAX_IMG; return `<span class="ip"><label class="ic"${lock ? ` title="Maximum ${MAX_IMG} images per defect"` : ''}><input type="checkbox" data-k="${m.k}"${sel.has(m.k) ? ' checked' : ''}${lock ? ' disabled' : ''}></label><a href="${E(m.u)}" data-n="${i}" target="_blank" rel="noopener noreferrer">Image ${i + 1}</a></span>`; }).join('');
  return `<article class="card${s.d ? ' on' : ''}${s.r ? ' rev' : ''}" data-id="${E(r.key)}">
<div class="ch"><div class="meta"><b>${E(r.asin || 'ASIN not found')}</b>${metaPills(r)}${tags}</div>
<div class="acts"><label${s.d ? ' title="Marked for dispute, so it stays reviewed"' : ''}><input type="checkbox" class="cr"${s.r ? ' checked' : ''}${s.d ? ' disabled' : ''}> Reviewed</label><label class="dl"><input type="checkbox" class="cd"${s.d ? ' checked' : ''}> Mark for Dispute</label></div></div>
<div class="db"${s.d ? '' : ' hidden'}><div class="dt"><button type="button" class="ghost" data-sa="1">Select first ${MAX_IMG} images</button><button type="button" class="ghost" data-sa="0">Clear images</button></div><textarea placeholder="Enter dispute comment (saved automatically)...">${E(s.c || '')}</textarea></div>
<div class="imgs">${n ? nav + '<div class="ilist">' + pills + '</div>' : '<i>No images in this row</i>'}</div>
<div class="info"><div><b>Associate response</b>${chips(r.resp, '')}</div><div><b>Auditor response</b>${chips(r.aud, '')}</div><div><b>Root cause</b>${rootHTML(r.root)}</div>
<div class="lk">${r.retail ? `<a href="${E(r.retail)}" target="_blank" rel="noopener noreferrer">Retail page</a>` : ''}${r.id ? `<a href="${DL}${E(r.id)}" target="_blank" rel="noopener noreferrer">Dispute link</a>` : ''}</div></div></article>`;
}

/* ---------- screen ---------- */
const isOn = (r, k) => (state[r.key] || {})[k];
function stats(f) {
  const rv = rows.filter(r => isOn(r, 'r')).length;
  $('stats').textContent = 'Showing ' + (f || flt()).length + ' of ' + rows.length + ' defects  |  Reviewed ' + rv + ' of ' + rows.length;
  $('prog').firstChild.style.width = (rows.length ? rv * 100 / rows.length : 0) + '%';
}
function statusBar() {
  const base = rows.filter(r => match(r, null, true)), n = fn => base.filter(fn).length;
  const c = { all: base.length, un: n(r => !isOn(r, 'r')), rev: n(r => isOn(r, 'r')), dis: n(r => isOn(r, 'd')) };
  $('status').innerHTML = Object.keys(SL).map(k => `<button data-s="${k}"${stat === k ? ' class="on"' : ''}>${SL[k]} <em>${c[k]}</em></button>`).join('');
}
function render() {
  activeCard = null; $('vbar').hidden = true;
  const f = flt();
  const ps = +$('psize').value, pages = Math.max(1, Math.ceil(f.length / ps));
  if (page >= pages) page = pages - 1;
  const shown = f.slice(page * ps, page * ps + ps);
  $('pager').innerHTML = `<button data-p="-1"${page ? '' : ' disabled'}>Previous</button>Page ${page + 1} of ${pages}<button data-p="1"${page < pages - 1 ? '' : ' disabled'}>Next</button>`;
  $('list').innerHTML = shown.map(card).join('') || '<p class="empty">No defects match these filters.</p>';
  ORDER.forEach(fillMS); statusBar();
  const ch = []; ORDER.forEach(k => F[k].forEach(v => ch.push(`<span class="fc">${MS[k]}: ${E(v)}<button data-k="${k}" data-v="${E(v)}">&times;</button></span>`)));
  $('chips').innerHTML = ch.length ? ch.join('') + '<button class="ghost" data-all="1">Clear all filters</button>' : '';
  stats(f);
  rcaRender();
}
// image links the user ticked for one defect (in the order shown)
const linksOf = (r, s) => (s.i || []).slice().sort((a, b) => a - b).map(k => (r.imgs.find(m => m.k === k) || {}).u).filter(Boolean).slice(0, MAX_IMG);
const pickedOf = c => [...c.querySelectorAll('.ic input:checked')].map(i => +i.dataset.k);
// once MAX_IMG images are ticked the rest are locked until one is un-ticked
function limitImgs(c) {
  const full = c.querySelectorAll('.ic input:checked').length >= MAX_IMG;
  c.querySelectorAll('.ic input').forEach(i => { const lock = full && !i.checked; i.disabled = lock; i.parentNode.title = lock ? 'Maximum ' + MAX_IMG + ' images per defect' : ''; });
}
function sumRender() {
  const d = rows.filter(r => isOn(r, 'd'));
  $('sum').hidden = !d.length; $('dc').textContent = d.length;
  $('slist').innerHTML = d.map(r => { const s = state[r.key], n = linksOf(r, s).length; return `<div class="si"><b>${E(r.asin)}</b> | ${E(r.assoc)} | ${n} image link${n === 1 ? '' : 's'} | ${E(s.c || '(no comment yet)')}</div>`; }).join('');
}

/* ---------- image window + arrows ---------- */
const curOf = c => (c.dataset.cur === undefined ? -1 : +c.dataset.cur);
function openImg(c, n) {
  const links = [...c.querySelectorAll('.ilist a')]; if (!links.length) return false;
  n = (n + links.length) % links.length; activeCard = c; c.dataset.cur = n;
  c.querySelectorAll('.ip').forEach((p, i) => p.classList.toggle('cur', i === n));
  const txt = 'Image ' + (n + 1) + ' of ' + links.length;
  c.querySelector('.icur').textContent = txt;
  $('vt').textContent = c.querySelector('.meta b').textContent + '  |  ' + txt; $('vbar').hidden = false;
  const W = Math.round(screen.availWidth * 0.5), L = (screen.availLeft || 0) + screen.availWidth - W;
  const w = window.open(links[n].href, 'imgview', 'width=' + W + ',height=' + screen.availHeight + ',left=' + L + ',top=' + (screen.availTop || 0) + ',scrollbars=yes,resizable=yes');
  if (w) w.focus();
  return !!w;
}
$('vp').addEventListener('click', () => activeCard && openImg(activeCard, curOf(activeCard) - 1));
$('vn').addEventListener('click', () => activeCard && openImg(activeCard, curOf(activeCard) + 1));
$('vx').addEventListener('click', () => { $('vbar').hidden = true; activeCard = null; });
document.addEventListener('keydown', e => {
  if (!activeCard || e.target.matches('textarea, select, input:not([type=checkbox])')) return;
  if (e.key === 'ArrowRight') openImg(activeCard, curOf(activeCard) + 1); else if (e.key === 'ArrowLeft') openImg(activeCard, curOf(activeCard) - 1);
});

/* ---------- events ---------- */
$('msbox').addEventListener('change', e => {
  const d = e.target.closest('.ms'); if (!d || e.target.classList.contains('sq')) return;
  const k = d.dataset.k; e.target.checked ? F[k].add(e.target.value) : F[k].delete(e.target.value); render();
});
$('msbox').addEventListener('input', e => { if (e.target.classList.contains('sq')) fillMS(e.target.closest('.ms').dataset.k); });
$('msbox').addEventListener('click', e => {
  const d = e.target.closest('.ms'); if (!d) return; const k = d.dataset.k;
  if (e.target.dataset.clr) { F[k].clear(); render(); }
  else if (e.target.dataset.all) { d.querySelectorAll('.ol input').forEach(i => F[k].add(i.value)); render(); }
});
document.addEventListener('click', e => document.querySelectorAll('.ms[open]').forEach(d => { if (!d.contains(e.target)) d.open = false; }));
$('status').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { stat = b.dataset.s; render(); } });
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.all) { F = newF(); $('q').value = ''; stat = 'all'; } else F[b.dataset.k].delete(b.dataset.v);
  render();
});
$('q').addEventListener('input', render);
$('sort').addEventListener('change', render);
$('psize').addEventListener('change', () => { page = 0; render(); });
$('pager').addEventListener('click', e => { if (e.target.dataset.p) { page += +e.target.dataset.p; render(); $('stats').scrollIntoView(); } });
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
['dragover', 'drop'].forEach(n => document.addEventListener(n, e => { e.preventDefault(); if (n === 'drop') loadFile(e.dataTransfer.files[0]); }));
$('list').addEventListener('change', e => {
  const el = e.target, c = el.closest('.card'); if (!c) return;
  const s = state[c.dataset.id] = state[c.dataset.id] || {};
  if (el.classList.contains('cr')) { s.r = el.checked; c.classList.toggle('rev', el.checked); }
  else if (el.classList.contains('cd')) {
    s.d = el.checked; c.classList.toggle('on', el.checked); c.querySelector('.db').hidden = !el.checked;
    const cr = c.querySelector('.cr');   // a disputed defect has been reviewed, so Reviewed stays ticked and locked
    if (el.checked) { s.r = true; c.classList.add('rev'); }
    cr.checked = !!s.r; cr.disabled = el.checked; cr.parentNode.title = el.checked ? 'Marked for dispute, so it stays reviewed' : '';
    if (!el.checked) { s.i = []; s.c = ''; c.querySelectorAll('.ic input').forEach(i => i.checked = false); limitImgs(c); c.querySelector('textarea').value = ''; }
  } else if (el.closest('.ic')) { s.i = pickedOf(c); limitImgs(c); }
  persist(); sumRender(); stats(); statusBar();
  rcaRender();
});
$('list').addEventListener('input', e => {
  if (e.target.tagName !== 'TEXTAREA') return;
  const c = e.target.closest('.card'), s = state[c.dataset.id] = state[c.dataset.id] || {};
  s.c = e.target.value; persist(); sumRender();
});
$('list').addEventListener('click', e => {
  const el = e.target, c = el.closest('.card'); if (!c) return;
  const a = el.closest('.ilist a'), nb = el.closest('[data-nav]');
  if (a) { if (openImg(c, +a.dataset.n)) e.preventDefault(); }
  else if (nb) openImg(c, curOf(c) + +nb.dataset.nav);
  else if (el.dataset.sa !== undefined) {
    const s = state[c.dataset.id] = state[c.dataset.id] || {};
    c.querySelectorAll('.ic input').forEach((i, n) => i.checked = el.dataset.sa === '1' && n < MAX_IMG);
    s.i = pickedOf(c); limitImgs(c); persist(); sumRender();
  }
});
$('clear').addEventListener('click', () => { if (confirm('Clear all saved Reviewed / Dispute marks and comments?')) { state = {}; persist(); render(); sumRender(); } });
$('rlist').addEventListener('click', e => { const b = e.target.closest('[data-rc]'); if (b) copyText(rcaText(rcaShown[+b.dataset.rc])); });
$('rcopy').addEventListener('click', () => copyText(rcaShown.map(rcaText).join('\n\n')));
$('rtg').addEventListener('click', () => { const h = $('rlist').hidden = !$('rlist').hidden; $('rtg').textContent = h ? 'Show' : 'Hide'; });
$('stg').addEventListener('click', () => { const h = $('slist').hidden = !$('slist').hidden; $('stg').textContent = h ? 'Show list' : 'Hide list'; });
window.addEventListener('scroll', () => { $('top').hidden = window.scrollY < 600; }, { passive: true });
$('top').addEventListener('click', () => window.scrollTo({ top: 0 }));

/* ---------- copy to Excel (clickable hyperlinks) ---------- */
function copyX() {
  const d = rows.filter(r => isOn(r, 'd')); if (!d.length) return;
  const rdOf = r => r.recv || usDate($('rd').value);
  const hd = ['Email Received Date', 'Associate ID']; for (let k = 1; k <= MAX_IMG; k++) hd.push('Link' + k);
  hd.push('Job Review Date', 'ASIN Link', 'Dispute Link', 'Dispute Comment');
  const q = String.fromCharCode(39), cs = 'border:1px solid #999999;padding:2px;', td = '<td style=' + q + cs + q + '>', th = '<th style=' + q + cs + 'background:#e0e0e0;' + q + '>';
  const attr = u => String(u).replace(/&/g, '&amp;').replace(/'/g, '%27').replace(/</g, '%3C').replace(/>/g, '%3E');
  const val = v => (v == null || v === '' ? 'N/A' : String(v)), clean = v => val(v).replace(/[\t\r\n]+/g, ' ');
  const cell = v => td + E(val(v)) + '</td>', lc = (u, l) => (u ? td + '<a href=' + q + attr(u) + q + '>' + l + '</a></td>' : td + '</td>');
  let html = '<table><tr>' + hd.map(h => th + h + '</th>').join('') + '</tr>', text = hd.join('\t') + '\n';
  d.forEach(r => {
    const s = state[r.key], links = linksOf(r, s), dl = r.id ? DL + r.id : '', rd = rdOf(r), login = (r.assoc || '').toLowerCase(), row = [clean(rd), clean(login)];
    html += '<tr>' + cell(rd) + cell(login);
    for (let i = 0; i < MAX_IMG; i++) { html += lc(links[i], 'image ' + (i + 1)); row.push(links[i] || ''); }
    html += cell(r.date) + lc(r.retail, 'asin_link') + lc(dl, 'Dispute_link') + cell(s.c) + '</tr>';
    row.push(clean(r.date), clean(r.retail), clean(dl), clean(s.c)); text += row.join('\t') + '\n';
  });
  html += '</table>';
  const noC = d.filter(r => !(state[r.key].c || '').trim()).length, noI = d.filter(r => !linksOf(r, state[r.key]).length).length;
  const note = [noC && noC + ' without a comment', noI && noI + ' without an image link'].filter(Boolean).join(', ');
  const done = () => {
    $('ok').textContent = note ? 'Copied. Note: ' + note : 'Copied!'; $('ok').style.color = note ? 'var(--warn)' : '';
    $('ok').style.display = 'inline'; setTimeout(() => $('ok').style.display = 'none', note ? 6000 : 3000);
  };
  const fallback = () => {
    const div = document.createElement('div'); div.style.cssText = 'position:fixed;left:-9999px'; div.innerHTML = html; document.body.appendChild(div);
    const rg = document.createRange(); rg.selectNodeContents(div); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg);
    document.execCommand('copy'); sl.removeAllRanges(); document.body.removeChild(div); done();
  };
  if (navigator.clipboard && window.ClipboardItem) navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]).then(done).catch(fallback);
  else fallback();
}
const usDate = iso => { const p = iso.split('-'); return p.length === 3 ? p[1] + '/' + p[2] + '/' + p[0] : ''; };
$('copy').addEventListener('click', copyX);
